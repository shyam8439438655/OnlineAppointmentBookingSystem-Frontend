<div class="min-h-screen bg-[#f8fafc] font-sans flex flex-col relative overflow-hidden">
  <div class="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>
  <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-bl from-indigo-100/50 via-teal-100/30 to-transparent rounded-full blur-[80px] pointer-events-none"></div>
  
  <app-navbar></app-navbar>
  <div class="max-w-3xl mx-auto px-6 py-12 relative z-10 w-full">
    <a [routerLink]="['/providers', providerId]" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-800 font-bold text-sm mb-8 transition-colors">
      <lucide-icon [name]="ArrowLeft" class="w-4 h-4"></lucide-icon> Back to Provider
    </a>

    <div class="bg-white rounded-[2rem] border border-slate-200 p-8 shadow-sm">
      <h1 class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Book Appointment</h1>
      <p class="text-slate-500 font-medium mb-8">Confirm your booking details below</p>

      <!-- Summary -->
      <div class="bg-indigo-50 border border-indigo-100 rounded-[1.5rem] p-6 mb-8 shadow-sm">
        <p class="text-xs uppercase font-extrabold text-indigo-500 mb-4 tracking-wider">Booking Summary</p>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <p class="text-slate-500 text-xs font-bold mb-1">Provider</p>
            <p class="text-slate-900 font-extrabold text-lg">
              {{ provider()?.fullName || 'Dr. ' + provider()?.specialization || 'Loading...' }}
            </p>
          </div>
          <div>
            <p class="text-slate-500 text-xs font-bold mb-1 flex items-center gap-1.5"><lucide-icon [name]="Calendar" class="w-3.5 h-3.5"></lucide-icon>Date</p>
            <p class="text-slate-900 font-extrabold text-lg">{{ formatDate(date) }}</p>
          </div>
        </div>
      </div>

      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Service Type</label>
          <select [(ngModel)]="form.serviceType"
            class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3.5 text-sm font-medium text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all appearance-none">
            <option value="General Consultation">General Consultation</option>
            <option value="Follow-Up">Follow-Up</option>
            <option value="Tele-Health">Tele-Health</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Payment Mode</label>
          <div class="grid grid-cols-2 gap-4">
            <button type="button" (click)="form.paymentMode = 'Online'"
              class="p-5 rounded-2xl border-2 text-left transition-all"
              [ngClass]="form.paymentMode === 'Online' ? 'border-indigo-600 bg-indigo-50 shadow-sm ring-1 ring-indigo-100 text-indigo-700' : 'border-slate-200 bg-white text-slate-500 hover:border-slate-300 hover:bg-slate-50'">
              <lucide-icon [name]="CreditCard" class="w-6 h-6 mb-3" [ngClass]="form.paymentMode === 'Online' ? 'text-indigo-600' : 'text-slate-400'"></lucide-icon>
              <p class="text-base font-extrabold" [ngClass]="form.paymentMode === 'Online' ? 'text-indigo-900' : 'text-slate-700'">Online Payment</p>
              <p class="text-sm font-medium mt-0.5 opacity-80">Card, UPI, Wallet</p>
            </button>
            <button type="button" (click)="form.paymentMode = 'Cash'"
              class="p-5 rounded-2xl border-2 text-left transition-all"
              [ngClass]="form.paymentMode === 'Cash' ? 'border-teal-600 bg-teal-50 shadow-sm ring-1 ring-teal-100 text-teal-700' : 'border-slate-200 bg-white text-slate-500 hover:border-slate-300 hover:bg-slate-50'">
              <lucide-icon [name]="Banknote" class="w-6 h-6 mb-3" [ngClass]="form.paymentMode === 'Cash' ? 'text-teal-600' : 'text-slate-400'"></lucide-icon>
              <p class="text-base font-extrabold" [ngClass]="form.paymentMode === 'Cash' ? 'text-teal-900' : 'text-slate-700'">Pay at Clinic</p>
              <p class="text-sm font-medium mt-0.5 opacity-80">Cash after visit</p>
            </button>
          </div>
        </div>

        <button (click)="handleBookingClick()" [disabled]="loading()"
          class="w-full bg-indigo-600 text-white hover:bg-indigo-700 font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 mt-8 text-base disabled:opacity-50 disabled:cursor-not-allowed">
          @if (loading()) {
            <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          } @else {
            <lucide-icon [name]="CheckCircle" class="w-5 h-5"></lucide-icon> Confirm Booking
          }
        </button>
      </div>
    </div>
  </div>
</div>
