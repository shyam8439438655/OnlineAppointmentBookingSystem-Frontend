<aside class="w-64 min-h-screen bg-white border-r border-slate-200 p-4 flex flex-col gap-1.5 shrink-0 shadow-sm">
  <div class="mb-6 px-3 pt-2">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Menu</p>
  </div>
  @for (link of links; track link.href) {
    <a
      [routerLink]="link.href"
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold transition-all"
      [ngClass]="isActive(link.href) 
        ? 'bg-indigo-50 text-indigo-700 shadow-sm shadow-indigo-600/5' 
        : 'text-slate-500 hover:text-slate-900 hover:bg-slate-50'"
    >
      <lucide-icon [name]="link.icon" class="w-5 h-5 shrink-0" 
        [ngClass]="isActive(link.href) ? 'text-indigo-600' : 'text-slate-400'"></lucide-icon>
      {{ link.label }}
    </a>
  }
</aside>
